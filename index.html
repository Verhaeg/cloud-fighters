<!doctype html>
<html lang="pt-BR">

<title>Cloud Fighters</title>

<style>

<body>
<canvas id="c"></canvas>
<div id="dmg"></div>

  <div class="row pill"><span>Turbo</span><div class="bar"><i id="fuel"></i></div></div>
  <div class="row pill" id="msl"><span>Míssil</span><div id="pips"></div></div>
  <div class="row pill"><span>Freio</span><div class="bar"><i id="brk" class="cdbar"></i></div></div>

</div>

<div id="banner">ONDA 1</div>
<div id="hint" class="pill"></div>

<div id="touch" class="hidden">
  <div id="zone"><div id="stick"><div id="knob"></div></div></div>
  <button class="btn" id="bView">Visão</button>
  <button class="btn" id="bTime">Hora +2</button>
  <button class="btn man" id="bBrk">Freio<small></small></button>
  <button class="btn man" id="bLoop">Loop<small></small></button>
  <button class="btn" id="bBoost">Turbo</button>
  <button class="btn alt" id="bUp">▲<small>Subir</small></button>
  <button class="btn alt" id="bDn">▼<small>Descer</small></button>
  <button class="btn" id="bMsl">Míssil<small id="mslN">6</small></button>
  <button class="btn" id="bFire">Fogo</button>
</div>

<div id="screen">
  <div class="card">
    <h1>CLOUD <em>FIGHTERS</em></h1>
    <p id="info">
      Voe 360° · setas na borda mostram onde estão os inimigos<br>
      Metralhadora sem limite · mísseis teleguiados recarregam com o tempo
    </p>
    <div class="go" id="go">Clique ou toque para decolar</div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;

// ---------- screen: low-res canvas scaled up = pixel art ----------
let PX = 3, W = 0, H = 0;
function resize() {
  PX = Math.max(2, Math.round(Math.min(innerWidth, innerHeight) / 260));
  W = Math.ceil(innerWidth / PX); H = Math.ceil(innerHeight / PX);
  cvs.width = W; cvs.height = H;
  cvs.style.width = W * PX + 'px'; cvs.style.height = H * PX + 'px';
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

// ---------- procedural terrain (infinite, chunked) ----------
const SEED = (Math.random() * 1e9) | 0;
function hash(x, y) {

function vnoise(x, y) {

// terrain elevation (world units, 1 = 100 ft): sea and lowlands at 0, the rocky island cores rise into mountains

  const ix = Math.floor(x), iy = Math.floor(y), ch = chunks.get(ckey(ix >> 7, iy >> 7));

const C = {

  sand:[233,217,166], grass:[88,162,46], light:[109,185,58], dark:[63,138,38],
  forest:[42,104,30], forest2:[31,82,22], rock:[138,138,138], rock2:[104,104,108],

const CLIFF_ROCK = [[132, 124, 114], [116, 110, 102], [144, 136, 124], [104, 98, 94]]; // layered rock
const CLIFF_SNOW = [[234, 240, 248], [210, 220, 234], [240, 244, 252], [200, 212, 228]];
const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const LCOL = [null, [255, 214, 122], [255, 243, 204], [255, 158, 80], [160, 230, 255]]; // city light colors
const CH = 128, chunks = new Map();
function lightLayer(ch) { // top view: the chunk's lights as a transparent canvas, built on first night use
  if (ch.lc) return ch.lc;
  const c = document.createElement('canvas'); c.width = c.height = CH; const g = c.getContext('2d'), img = g.createImageData(CH, CH), d = img.data;

  const bx = cx * CH, by = cy * CH, N = CH + 1, raw = new Uint32Array(CH * CH), el = new Float32Array(CH * CH), hb = new Float32Array(N * N), eb = new Float32Array(N * N);

      const ii = i + s, jj = j - s;

  const pcx = Math.floor(P.x / CH), pcy = Math.floor(P.y / CH), dx = Math.cos(P.a), dy = Math.sin(P.a);
  for (let r = 0; r <= 9; r++) for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {

  [4.8,  [14, 20, 48],   [40, 40, 78],    [.28, .29, .45], .8],
  [6,    [60, 88, 150],  [250, 150, 90],  [.75, .6, .55], .15],
  [7.5,  [90, 150, 215], [230, 205, 175], [.95, .88, .8], 0],
  [10,   [96, 160, 226], [205, 228, 246], [1, 1, 1], 0],
  [16,   [96, 160, 226], [205, 228, 246], [1, 1, 1], 0],
  [17.5, [80, 122, 192], [250, 190, 120], [1, .86, .72], 0],
  [18.7, [58, 60, 122],  [240, 112, 72],  [.72, .52, .5], .1],
  [19.8, [18, 22, 56],   [58, 40, 80],    [.3, .29, .46], .75],
  [24,   [8, 12, 30],    [22, 30, 60],    [.22, .26, .42], 1],
